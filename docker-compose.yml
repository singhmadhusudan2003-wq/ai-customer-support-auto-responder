version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: support-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/backend
      - ./dataset:/app/dataset
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./support.db
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_SUPER_SECRET_KEY_IN_PRODUCTION}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@123}
      - USE_OPENAI=${USE_OPENAI:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: support-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
